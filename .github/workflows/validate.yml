name: Comprobar datos y web
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate survey data and regenerate bundle
        run: python3 scripts/sync-data.py
      - name: Verify derived data is committed
        run: git diff --exit-code -- data/polls.js
      - name: Verify JavaScript syntax
        run: node --check app.js && node --check data/polls.js
